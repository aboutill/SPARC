# Image and mask transforms
transforms:
  pixdim:
  - 2
  - 2
  - 2

# UNet architecture
unet:
  act: RELU
  bias: false
  channels:
  - 16
  - 32
  - 64
  - 128
  - 256
  in_channels: 1
  kernel_size: 3
  norm: BATCH
  num_res_units: 0
  out_channels: 1
  spatial_dims: 3
  strides:
  - 2
  - 2
  - 2
  - 2
  up_kernel_size: 3

# Inferer
inferer:
  overlap: 0.25
  padding_mode: reflect
  roi_size:
  - 112
  - 112
  - 32
  sw_batch_size: 64

# Post processing
post_processing:
  connectivity: null
  num_components: 1
